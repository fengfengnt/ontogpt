[project]
name = "procurement-ontology-service"
version = "0.1.0"
description = "Enterprise-scoped procurement ontology service"
requires-python = ">=3.10,<3.15"
dependencies = ["ontogpt", "pydantic>=2.4.0", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["procurement_ontology*"]

[tool.uv.sources]
ontogpt = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=7.1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
