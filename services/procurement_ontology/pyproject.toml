[project]
name = "procurement-ontology-service"
version = "0.1.0"
description = "Enterprise-scoped procurement ontology service"
requires-python = ">=3.10,<3.15"
dependencies = [
    "ontogpt",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "rdflib>=6.2",
    "requests>=2.31,<3",
    "click>=8.1",
    "fastapi>=0.148.0,<0.149",
    "uvicorn>=0.54.0,<0.55",
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1",
    "langgraph>=1.2.16,<2",
    "filelock>=3.32.7",
]

[project.scripts]
activate-schema = "procurement_ontology.cli:activate_schema_command"
procurement-service = "procurement_ontology.runtime:main"

[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["procurement_ontology*"]

[tool.uv.sources]
ontogpt = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=7.1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/integration"]
